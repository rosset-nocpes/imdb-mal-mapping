name: Release

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1" # weekly data refresh
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm trusted publishing + provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: bun install --frozen-lockfile

      - run: bun run build:index

      - run: bun run check # oxfmt, oxlint, tsc, tests

      # Publishes only when package.json has a new version or the data changed.
      - run: bun run release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
