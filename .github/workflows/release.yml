name: Release

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1" # weekly data refresh
  workflow_dispatch:

permissions:
  contents: write # version commit, tag and GitHub Release

# A push and the weekly run must not pick the same next version.
concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - run: bun run build:index

      - run: bun run check # oxfmt, oxlint, tsc, tests

      # A new package.json version ships as is. Otherwise, changed data ships
      # as the next patch over npm's latest, which records its dataHash.
      - name: Choose version
        id: version
        run: |
          pkg=$(jq -r .name package.json)
          version=$(jq -r .version package.json)
          hash=$(bun -p 'require("./src/dataset.ts").hash')
          if curl -fs -o /dev/null "https://registry.npmjs.org/$pkg/$version"; then
            latest=$(curl -fsS "https://registry.npmjs.org/$pkg/latest")
            if [ "$(jq -r .dataHash <<<"$latest")" = "$hash" ]; then
              echo "$pkg@$(jq -r .version <<<"$latest") already has data $hash."
              exit 0
            fi
            IFS=. read -r major minor patch <<<"$(jq -r .version <<<"$latest")"
            version="$major.$minor.$((patch + 1))"
          fi
          jq --arg v "$version" --arg h "$hash" '.version = $v | .dataHash = $h' package.json >package.tmp
          mv package.tmp package.json
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "hash=$hash" >>"$GITHUB_OUTPUT"

      - if: steps.version.outputs.version
        run: bun publish
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Puts the published version back in main's package.json (without
      # dataHash) and tags that commit. Pushes made with github.token don't
      # start workflows, so this can't loop.
      - name: Commit version and tag
        if: steps.version.outputs.version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git checkout package.json
          jq --arg v "$VERSION" '.version = $v' package.json >package.tmp
          mv package.tmp package.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --quiet || git commit -qam "chore: release v$VERSION"
          git tag "v$VERSION"
          git push --atomic origin HEAD:main "v$VERSION"

      - if: steps.version.outputs.version
        run: >
          gh release create "v${{ steps.version.outputs.version }}"
          --verify-tag
          --title "v${{ steps.version.outputs.version }}"
          --notes "Data hash: \`${{ steps.version.outputs.hash }}\`"
          --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
