name: Release

# Publishes the library when package.json carries a version npm doesn't have
# yet. Data updates never need a release (see data.yml).
#
# Uses npm trusted publishing: no token. Set it up once on npmjs.com under the
# package's Settings → Trusted Publisher → GitHub Actions, with this
# repository and the workflow file name `release.yml`.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # tag and GitHub Release
  id-token: write # npm trusted publishing

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find an unpublished version
        id: version
        run: |
          name=$(jq -r .name package.json)
          version=$(jq -r .version package.json)
          if curl -fs -o /dev/null "https://registry.npmjs.org/$name/$version"; then
            echo "$name@$version is already published."
          else
            echo "version=$version" >>"$GITHUB_OUTPUT"
          fi

      - if: steps.version.outputs.version
        uses: oven-sh/setup-bun@v2

      - if: steps.version.outputs.version
        run: bun install --frozen-lockfile

      - if: steps.version.outputs.version
        run: bun run check # oxfmt, oxlint, tsc, tests

      # Trusted publishing needs npm 11.5.1+, which Node 24 ships.
      - if: steps.version.outputs.version
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - if: steps.version.outputs.version
        run: npm publish

      - if: steps.version.outputs.version
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git tag "v$VERSION"
          git push origin "v$VERSION"
          gh release create "v$VERSION" --verify-tag --title "v$VERSION" --generate-notes
